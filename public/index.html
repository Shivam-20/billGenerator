<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haldiram Invoice Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <!-- LEFT PANEL: FORM -->
        <div class="form-panel">
            <div class="header">
                <h1>🍽️ Invoice Generator</h1>
                <p>Restaurant Service Tax Invoice</p>
            </div>

            <form id="invoiceForm">
                <div class="actions">
                    <button type="button" class="btn btn-secondary" onclick="loadDefaults()">Load Defaults</button>
                    <button type="button" class="btn btn-primary" onclick="generateFinal()">Download / Print</button>
                    <span class="live-badge">Live Preview Active</span>
                </div>

                <!-- STORE DETAILS -->
                <div class="section">
                    <h2>Store Details</h2>
                    
                    <div class="form-group">
                        <label>Upload Logo</label>
                        <input type="file" id="logo" name="logo" accept="image/*">
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label>Company Name</label>
                            <input type="text" id="companyName" name="companyName">
                        </div>
                        <div class="form-group">
                            <label>Store Name</label>
                            <input type="text" id="storeName" name="storeName">
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="text" id="storePhone" name="storePhone">
                        </div>
                        <div class="form-group">
                            <label>GSTIN</label>
                            <input type="text" id="gstin" name="gstin">
                        </div>
                    </div>
                    
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Store Address</label>
                            <input type="text" id="storeAddress" name="storeAddress">
                        </div>
                        <div class="form-group">
                            <label>Registered Address</label>
                            <input type="text" id="registeredAddress" name="registeredAddress">
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group"><label>State Code</label><input type="text" id="stateCode" name="stateCode"></div>
                        <div class="form-group"><label>CIN</label><input type="text" id="cin" name="cin"></div>
                        <div class="form-group"><label>FSSAI</label><input type="text" id="fssaiNo" name="fssaiNo"></div>
                        <div class="form-group"><label>SAC</label><input type="text" id="sacCode" name="sacCode"></div>
                    </div>
                    
                    <div class="form-grid">
                        <div class="form-group"><label>Store ID</label><input type="text" id="storeId" name="storeId"></div>
                        <div class="form-group"><label>POS No</label><input type="text" id="posNo" name="posNo"></div>
                        <div class="form-group"><label>Place of Supply</label><input type="text" id="placeOfSupply" name="placeOfSupply"></div>
                    </div>
                </div>

                <!-- INVOICE & CUSTOMER -->
                <div class="section">
                    <h2>Order Details</h2>
                    <div class="form-grid">
                        <div class="form-group"><label>Invoice No</label><input type="text" id="invoiceNumber" name="invoiceNumber"></div>
                        <div class="form-group"><label>Date & Time</label><input type="text" id="date" name="date"></div>
                        <div class="form-group"><label>Order No</label><input type="text" id="orderNo" name="orderNo"></div>
                        <div class="form-group"><label>Token No</label><input type="text" id="tokenNo" name="tokenNo"></div>
                    </div>
                    <div class="form-grid">
                        <div class="form-group"><label>Cashier ID</label><input type="text" id="cashierId" name="cashierId"></div>
                        <div class="form-group"><label>Cashier Name</label><input type="text" id="cashierName" name="cashierName"></div>
                    </div>
                    
                    <div class="form-grid" style="margin-top:1rem; border-top:1px solid #ddd; padding-top:1rem">
                        <div class="form-group"><label>Customer Name</label><input type="text" id="customerName" name="customerName"></div>
                        <div class="form-group"><label>Customer Phone</label><input type="text" id="customerPhone" name="customerPhone"></div>
                    </div>
                </div>

                <!-- ITEMS -->
                <div class="section">
                    <h2>Items</h2>
                    <div id="itemsContainer" class="items-container">
                        <!-- Items injected by script -->
                    </div>
                    <button type="button" class="btn btn-secondary" onclick="addItem()" style="margin-top:1rem; width:100%">+ Add Item</button>
                </div>

                <!-- PAYMENT -->
                <div class="section">
                    <h2>Payment</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Method</label>
                            <select id="paymentMethod" name="paymentMethod">
                                <option value="Cash">Cash</option>
                                <option value="Pine Lab UPI">Pine Lab UPI</option>
                                <option value="Card">Card</option>
                                <option value="Paytm">Paytm</option>
                                <option value="PhonePe">PhonePe</option>
                                <option value="Google Pay">Google Pay</option>
                            </select>
                        </div>
                        <div class="form-group"><label>Trans. Ref</label><input type="text" id="transactionRefNo" name="transactionRefNo"></div>
                        <div class="form-group"><label>Serial No</label><input type="text" id="serialNo" name="serialNo"></div>
                    </div>
                </div>
            </form>
            <div style="height: 50px;"></div> <!-- Spacer -->
        </div>

        <!-- RIGHT PANEL: PREVIEW -->
        <div class="preview-panel">
            <div class="preview-header">
                <h3>PDF Preview</h3>
                <span style="font-size:0.8rem; color:#666">Updates automatically</span>
            </div>
            <iframe id="previewFrame" class="preview-frame" src="about:blank"></iframe>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
